<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice1</title>
    <style>
        #colorDiv {
            width: 100px;
            height: 100px;
            background: black;
        }
        #sizeDiv{
            width: 200px;
            height: 200px;
            background: black;
        }
    </style>
</head>
<body>
    <h2>문제1. 색상 선택후 변경 버튼을 클릭하면 색상이 변경되도록 만들어라</h2>
    <div id="colorDiv"></div>
    <input type="color" id="colBtn">
    <input type="button" value="변경" onclick="changeColDiv(colBtn.value)">

    <br>
    <br>

    <h2>문제2. 버튼에 따른 크기조절이 가능하게 만들어라</h2>
    <div id="sizeDiv"></div>
    <input type="button" value="50x50" onclick="chageSizeDiv(50,50)">
    <input type="button" value="100x100" onclick="chageSizeDiv(100,100)">
    <input type="button" value="200x200" onclick="chageSizeDiv(200,200)">

    <script>
        function changeColDiv(color) {
            let colDiv = document.getElementById('colorDiv');
            colDiv.style.background = color;
        }

        function chageSizeDiv(width,height) {
            let sizeDiv = document.getElementById('sizeDiv');

            sizeDiv.style.width = width+"px";
            sizeDiv.style.height = height+"px";
        }

    </script>
</body>
</html>

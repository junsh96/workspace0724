<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice4</title>
    <style>
        .idInput {
            display: flex;
        }
        .pwdInput {
            display: flex;
        }
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>회원가입</legend>
            <div class="idInput">
                아이디 : <input type="text" id="userId" onkeyup="userIdChk();"><div id ="userIdChkDiv"></div>
            </div>
            <br>
            비밀번호 : <input type="password" id="userPwd">
            <br>
            <br>
            <div class="pwdInput">
                비밀번호 확인 : <input type="password" id="pwdChk" onblur="passwordChk();"><div id="pwdChkDiv"></div> 
            </div>
            <br>
            이름 : <input type="text" id="userNm">
            <br>
            <br>
            <button type="button" onclick="signUp();">회원가입</button>
        </fieldset>
    </form>


    <script>
        
        function userIdChk() {
            let userId = document.getElementById("userId");
            let userIdChkDiv = document.getElementById("userIdChkDiv");
            if (userId.value === 'user01') {
                userIdChkDiv.textContent = '이미 존재하는 아이디 입니다.'
                userIdChkDiv.style.color = 'red';
                
            } else {
                userIdChkDiv.textContent = '사용 가능한 아이디 입니다.'
                userIdChkDiv.style.color = 'green';
            }
        }

        function passwordChk() {
            
            let userPwd = document.getElementById("userPwd");
            let pwdChk = document.getElementById("pwdChk");
            let pwdChkDiv = document.getElementById("pwdChkDiv");
            
            if (userPwd.value == pwdChk.value) {
                pwdChkDiv.textContent = '비밀번호가 일치 합니다.'
                pwdChkDiv.style.color='green';
            } else {
                pwdChkDiv.textContent = '비밀번호가 일치 하지 않습니다.'
                pwdChkDiv.style.color='red';
            }

        }

        function signUp() {
            let userNm = document.getElementById("userNm");
            
            let userId = document.getElementById("userId");
            let userPwd = document.getElementById("userPwd");
            let pwdChk = document.getElementById("pwdChk");
            let pwdChkDiv = document.getElementById("pwdChkDiv");
            let userIdChkDiv = document.getElementById("userIdChkDiv");

            if(userId.value ==='') {
                userId.focus();
                alert('아이디를 입력해주세요.')
                return;
            } 
            if(userPwd.value ==='') {
                userPwd.focus();
                alert('비밀번호를 입력해주세요.')
                return;
            } 
            if(pwdChk.value ==='') {
                pwdChk.focus();
                alert('비밀번호 확인을 입력해주세요.')
                return;
            } 
            if(userNm.value ==='') {
                userNm.focus();
                alert('이름을 입력해주세요.')
                return;
            }   

            if (userId.value === 'user01') {
                userId.focus();
                userId.value = '';
                alert("사용할수 없는 아이디 입니다.")
                return;
            }

            if (userPwd.value !== pwdChk.value) {
                pwdChk.focus();
                pwdChk.value = '';
                alert("비밀번호가 일치 하지 않습니다.")
                return; 
            }

            

            
            alert(userNm.value+"님 , 회원가입이 성공적으로 완료되었습니다. ^^");
            
            userNm.value = "";
            userId.value = "";
            userPwd.value = "";
            pwdChk.value = "";
            pwdChkDiv.textContent ="";
            userIdChkDiv.textContent ="";
        }

    </script>
</body>
</html>

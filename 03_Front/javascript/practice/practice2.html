<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice2</title>
    <style>
        .hobbyDiv1 {
            display: flex;
        }

        .area {
            background: white;
            width: 500px;
            height: 300px;
            border: 1px solid red;
        }
        .hobbyDiv2{
            margin-left: 83px;
        }
    </style>
</head>
<body>
    <div>
        <form id="hobbyInput">
            <fieldset>
                <legend>취미</legend>
                <div class="hobbyDiv1">
                    <input type="checkbox" id="allCheck" onchange="allcheck();">전체 선택
                    <input type="checkbox" name="hobby" value="종합" onchange="checkAll();">종합
                    <input type="checkbox" name="hobby" value="소설" onchange="checkAll();">소설
                    <input type="checkbox" name="hobby" value="시/에세이" onchange="checkAll();">시/에세이
                    <input type="checkbox" name="hobby" value="경제/경영" onchange="checkAll();">경제/경영
                    <input type="checkbox" name="hobby" value="자기개발" onchange="checkAll();">자기개발
                    <input type="checkbox" name="hobby" value="아동" onchange="checkAll();">아동
                </div>
                <div class="hobbyDiv2">
                    <input type="checkbox" name="hobby" value="여행" onchange="checkAll();">여행
                    <input type="checkbox" name="hobby" value="과학" onchange="checkAll();">과학
                    <input type="checkbox" name="hobby" value="역사/문학" onchange="checkAll();">역사/문화
                    <input type="checkbox" name="hobby" value="외국어" onchange="checkAll();">외국어
                    <input type="checkbox" name="hobby" value="컴퓨터" onchange="checkAll();">컴퓨터
                    <input type="checkbox" name="hobby" value="만화" onchange="checkAll();">만화
                </div>
            </fieldset>
            
        </form>
    </div>

    <br>
    <div>
        <button onclick="textOn();">카테고리 선택</button>
        <div id="area1" class="area"></div>
    </div>


    <script>

        function checkAll() {
            let hobbyList = document.getElementsByTagName('input');
            let allTrue = false;
            let checked = hobbyList[0].checked;
            if (checked) {
                for (let i=0; i<hobbyList.length; i++) {
                    let checkAll = hobbyList[i].checked;
                    if (!checkAll) {
                        hobbyList[0].checked = false;
                    }
                }

            } else {
                
                for (let i=0; i<hobbyList.length; i++) {
                    let checkAll = hobbyList[i].checked;
                    if (i !==0 && !checkAll) {
                       allTrue = false;
                       return;
                    } else {
                        allTrue = true;
                    }
                }
                console.log(allTrue);
                if (allTrue) {
                    hobbyList[0].checked= true;
                }

            }
        }


        function allcheck() {
            let hobbyList = document.getElementsByTagName('input');
            
            let checked = hobbyList[0].checked;
            
            if (checked) {
                for (let i=0; i<hobbyList.length; i++) {
                    hobbyList[i].checked = true;
                }
            } else {
                for (let i=0; i<hobbyList.length; i++) {
                    hobbyList[i].checked = false;
                }
            }
        }

        function textOn() {
            let area = document.getElementById("area1");
            area.innerHTML = "";

            let hobbyList = document.getElementsByTagName('input');
            
            console.log("test",hobbyList);

            for(let i=0; i<hobbyList.length; i++) {
                let checked = hobbyList[i].checked;
                if (i!==0 && checked) {
                    area.innerHTML += hobbyList[i].value+" ";
                }
            }


        }

    </script>
</body>
</html>

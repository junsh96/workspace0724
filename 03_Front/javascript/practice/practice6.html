<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice6</title>
    <style>

        .searchArea {
            height: 80px;
            background: rgb(212, 210, 210);
            display: none;
        }
        legend{
            margin: 0 auto;
        }
        .inputDiv{
            display: flex;
            justify-content: center;
        }

    </style>
</head>
<body>
    <h1>Practice6</h1>
        <form>
            <fieldset>
                <legend>검색할 항목을 선택하세요.</legend>
                <div class="inputDiv">
                    <input type="radio" name="search" value="title"> 제목
                    <input type="radio" name="search" value="date"> 날짜
                    <input type="radio" name="search" value="user"> 작성자
                </div>
            </fieldset>
        </form>

        <br>

        <div id="search-title" class="searchArea">
            검색할 제목을 입력하세요. : <br>
            <input type="text"> 
            <button>검색</button>
        </div>
        
        <div id="search-date"  class="searchArea">
            검색할 날짜를 입력하세요 : <br>
            <input type="date"> - <input type="date">
            <button>검색</button>
        </div>

        <div id="search-user"  class="searchArea">
            검색할 작성자 아이디를 입력하세요 : <br>
            <input type="text">
            <button>검색</button>
        </div>

        <script>
            function changeDisplay(id,value) {
                id.style.display = value;
            }

            function callById(id) {

                return document.getElementById(id);
            }

            const radio = document.getElementsByName('search');
            console.log(radio);
            let titleDiv = callById('search-title');
            let dateDiv = callById('search-date');
            let userDiv = callById('search-user');
            for (let i=0; i<radio.length; i++) {
                radio[i].addEventListener("change",function(ev) {
                    let val = radio[i].value;
                    console.log(val);
                    if (val === 'title') {
                        titleDiv.style.display = 'block';
                        dateDiv.style.display = 'none';
                        userDiv.style.display = 'none';
                    } else if (val === 'date') {
                        titleDiv.style.display = 'none';
                        dateDiv.style.display = 'block';
                        userDiv.style.display = 'none';
                    } else if (val === 'user') {
                        titleDiv.style.display = 'none';
                        dateDiv.style.display = 'none';
                        userDiv.style.display = 'block';
                    }
                })
            }

        </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice2</title>
    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous">
    </script>
    <style>
        .hobbyDiv1 {
            display: flex;
        }

        .area {
            background: white;
            width: 500px;
            height: 300px;
            border: 1px solid red;
        }
        .hobbyDiv2{
            margin-left: 83px;
        }
    </style>
</head>
<body>
    <div>
        <form id="hobbyInput">
            <fieldset>
                <legend>취미</legend>
                <div class="hobbyDiv1">
                    <input type="checkbox" id="allCheck">전체 선택
                    <input type="checkbox" name="hobby" value="종합" class="checkAll">종합
                    <input type="checkbox" name="hobby" value="소설" class="checkAll">소설
                    <input type="checkbox" name="hobby" value="시/에세이" class="checkAll">시/에세이
                    <input type="checkbox" name="hobby" value="경제/경영" class="checkAll">경제/경영
                    <input type="checkbox" name="hobby" value="자기개발" class="checkAll">자기개발
                    <input type="checkbox" name="hobby" value="아동" class="checkAll">아동
                </div>
                <div class="hobbyDiv2">
                    <input type="checkbox" name="hobby" value="여행" class="checkAll">여행
                    <input type="checkbox" name="hobby" value="과학" class="checkAll">과학
                    <input type="checkbox" name="hobby" value="역사/문학" class="checkAll">역사/문화
                    <input type="checkbox" name="hobby" value="외국어" class="checkAll">외국어
                    <input type="checkbox" name="hobby" value="컴퓨터" class="checkAll">컴퓨터
                    <input type="checkbox" name="hobby" value="만화" class="checkAll">만화
                </div>
            </fieldset>
            
        </form>
    </div>

    <br>
    <div>
        <button id="textOn">카테고리 선택</button>
        <div id="area1" class="area"></div>
    </div>


    <script>
        $(function() {
            
            $('.checkAll').change(function() {
                let checkAll = $('.checkAll');
                if (this.checked) {
                    for (let i=0; i<checkAll.length; i++) {
                        console.log(checkAll[i].checked);
                        if (!checkAll[i].checked) {
                            return;
                        } else if(checkAll[checkAll.length-1].checked) {
                            $('#allCheck').prop("checked", true);
                        }
                    }
                } else {
                    $("#allCheck").prop("checked", false);  
                }

            })
        })


        $("#allCheck").change(function() {

            let allCheck = $("#allCheck")[0].checked;

            $(".checkAll").prop("checked",allCheck);

        });

        //jquery에서 배열.each(function(인덱스, 요소){반복할코드})
        $('#textOn').click(function() {
            let valList = $('.checkAll');
            console.log(valList);
            

            for(let i=0; i<valList.length; i++) {
                let checked = valList[i].checked;

                if (checked) {
                    $('#area1').html($('#area1').html()+valList[i].defaultValue + " ");
                }
            }
        });



    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>house acccount</title>
    
    <!-- 외부 라이브러리 -->
    <!-- google web font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">

    <!-- 내부 import -->
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <div class="container">

        <header class="header">
            <h1>가계부</h1>

            
            <div class="all-account">
                <span>현재 잔액</span>
                <spna class="all-acount-sum">0원</spna>
            </div>

        </header>


        <div class="account-input">
            <input id="account-comment" type="text" placeholder="내용을 입력하세요(예 점심값, 월급)">
            <input id="account" type="number" placeholder="금액을 입력하세요">
        </div>
        <div class="account-btn">
            <button class="plus-btn checked">수입</button>
            <button class="minus-btn">지출</button>
        </div>
        <div class="add-btn" id="add-btn">
            <button>추가하기</button>
        </div>
        <br>


        <div class="filter-button">
            <button data-filter="all" class="active">전체</button>
            <button data-filter="plus">수입</button>
            <button data-filter="minus">지출</button>
        </div>
        

         <div class="account-sum">
            <div class="account">
                <span>총 수입</span>
                <span class="all-plus sum">0원</span>
            </div>
            <div class="account">
                <span>총 지출</span>
                <span class="all-minus sum">0원</span>
            </div>
            <div class="account">
                <span>잔액</span>
                <span class="all-plus sum all">0원</span>
            </div>
            
        </div>

        <ul class="account-list" id="account-list">

        </ul>

       

    </div>


    <script src="../JavaScript/script.js"></script>
</body>
</html>
